  <!-- JS Slide Dinámico -->
<script>
(async function(){
  const HL_URL  = 'assets/data/home-highlights.json';
  const REV_URL = 'revistas.json'; // ajusta si vive en otra ruta
  const FLIPBOOK_URL = 'flipbook2.html'; // visor

  const $mag = document.getElementById('slide-magazine');
  const $yt  = document.getElementById('slide-youtube');
  const $sp  = document.getElementById('slide-podcast');

  const fetchJSON = async (url)=> {
    const r = await fetch(url, {cache:'no-store'});
    if(!r.ok) throw new Error('HTTP '+r.status+' '+url);
    return r.json();
  };

  // --------- Revista (auto desde revistas.json o manual del JSON) ---------
  function parseDate(x){
    if(!x) return 0;
    // acepta '2025-02-01', '01/02/2025', etc.
    const d = new Date(x);
    return isNaN(d) ? 0 : d.getTime();
  }

  function normalizeRevista(r){
    // Intentamos distintos esquemas de claves
    const title = r.title || r.titulo || 'Revista';
    const desc  = r.desc || r.descripcion || r.resumen || '';
    const slug  = r.slug || '';
    const cover = r.cover || r.portada || (slug ? `assets/revistas/portadas/${slug}.jpg` : '');
    const doc   = r.doc || r.pdf || r.file || (slug ? `assets/revistas/${slug}.pdf` : '');
    const date  = r.date || r.fecha || '';
    return { title, desc, cover, doc, date };
  }

  async function getLatestMagazine(){
    try{
      const data = await fetchJSON(REV_URL);
      const list = Array.isArray(data) ? data : (data.revistas || data.items || []);
      if(!list.length) return null;
      const mapped = list.map(normalizeRevista);
      mapped.sort((a,b)=> parseDate(b.date) - parseDate(a.date));
      return mapped[0];
    }catch(e){
      console.warn('No se pudo leer revistas.json:', e);
      return null;
    }
  }

// Revista: llena el marco (cover)
function magazineSlideHTML(m){
  const href = `${FLIPBOOK_URL}?doc=${encodeURIComponent(m.doc)}`;
  return `
    <div class="col-12 col-lg-4">
      <a class="hl-media" href="${href}" aria-label="Abrir revista: ${m.title}">
        <img src="${m.cover}" alt="${m.title}" loading="lazy">
      </a>
    </div>
    <div class="col-12 col-lg-8">
      <h3 class="hl-title mb-3">${m.title}</h3>
      <p class="hl-desc mb-0">${m.desc || ''}</p>
    </div>`;
}

  // --------- YouTube ---------
  function youtubeIdFromUrl(url){
    if(!url) return '';
    const m = url.match(/(?:youtu\.be\/|v=|\/shorts\/|embed\/)([A-Za-z0-9_-]{6,})/);
    return m ? m[1] : '';
  }
// YouTube: no recortar (contain)
function youtubeSlideHTML(o){
  const id = youtubeIdFromUrl(o.url || '');
  const thumb = id ? `https://img.youtube.com/vi/${id}/hqdefault.jpg` : '';
  const href = o.url || '#';
  return `
    <div class="col-12 col-lg-4">
      <a class="hl-media hl-media--contain" href="${href}" target="_blank" rel="noopener">
        ${thumb ? `<img src="${thumb}" alt="${o.title || 'Video'}" loading="lazy">` : ``}
      </a>
    </div>
    <div class="col-12 col-lg-8">
      <h3 class="hl-title mb-3">${o.title || 'Video'}</h3>
      <p class="hl-desc mb-0">${o.desc || ''}</p>
    </div>`;
}

  // --------- Spotify ---------
  function spotifyEmbedUrl(url){
    if(!url) return '';
    // open.spotify.com/episode/...  -> embed
    return url.replace('open.spotify.com/', 'open.spotify.com/embed/');
  }
// Spotify: no recortar (contain)
function spotifySlideHTML(o){
  const embed = spotifyEmbedUrl(o.url || '');
  return `
    <div class="col-12 col-lg-4">
      <div class="hl-media hl-media--contain">
        ${embed ? `<iframe src="${embed}" allow="encrypted-media; clipboard-write; fullscreen" loading="lazy"></iframe>` : ``}
      </div>
    </div>
    <div class="col-12 col-lg-8">
      <h3 class="hl-title mb-3">${o.title || 'Podcast'}</h3>
      <p class="hl-desc mb-0">${o.desc || ''}</p>
    </div>`;
}

  try{
    const hl = await fetchJSON(HL_URL);

    // Revista
    let mag = null;
    if (hl.magazine && hl.magazine.auto !== false){
      mag = await getLatestMagazine();
    }
    if(!mag && hl.magazine){
      // manual
      mag = {
        title: hl.magazine.title || 'Revista',
        desc:  hl.magazine.desc  || '',
        cover: hl.magazine.cover || '',
        doc:   hl.magazine.doc   || ''
      };
    }
    if(mag){ $mag.innerHTML = magazineSlideHTML(mag); }

    // YouTube
    if(hl.youtube){ $yt.innerHTML = youtubeSlideHTML(hl.youtube); }

    // Spotify
    if(hl.podcast){ $sp.innerHTML = spotifySlideHTML(hl.podcast); }

  }catch(err){
    console.error('Highlights error:', err);
    $mag.innerHTML = `<div class="col"><p class="text-white-50 mb-0">No se pudieron cargar los destacados.</p></div>`;
  }
})();
</script>
