<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Destacados de Inicio · Admin</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root{
      --bg:#0e1726; --card:#1f2f44; --ink:#e8eef8;
      --card-bd: rgba(255,255,255,.08);
    }
    html,body{ background:var(--bg); color:var(--ink); }
    .card{ background:var(--card); border:1px solid var(--card-bd); }
    label{ font-weight:600; }
    .muted{ opacity:.8; font-size:.95rem; }
  </style>
</head>
<body class="p-3">

  <div class="container" style="max-width: 900px">
    <header class="mb-3">
      <h1 class="h3 mb-1">Destacados de la página de inicio</h1>
      <p class="muted mb-0">Edita la Revista (automática o manual), Video de YouTube y Podcast de Spotify.</p>
    </header>

    <form id="form" class="vstack gap-4">

      <!-- Revista -->
      <div class="card p-3">
        <h2 class="h5 mb-3">Revista</h2>

        <div class="form-check form-switch mb-3">
          <input class="form-check-input" type="checkbox" id="magAuto">
          <label class="form-check-label" for="magAuto">
            Usar automáticamente la última revista publicada
          </label>
        </div>

        <div class="row g-3" id="magManual">
          <div class="col-md-6">
            <label class="form-label">Portada (URL)</label>
            <input class="form-control" id="magCover" placeholder="assets/revistas/portadas/....jpg">
          </div>
          <div class="col-md-6">
            <label class="form-label">Documento PDF (URL)</label>
            <input class="form-control" id="magDoc" placeholder="assets/revistas/....pdf">
          </div>
          <div class="col-12">
            <label class="form-label">Título</label>
            <input class="form-control" id="magTitle" placeholder="Ej. REVISTA INTERco.MX ED. 7">
          </div>
          <div class="col-12">
            <label class="form-label">Descripción</label>
            <textarea class="form-control" id="magDesc" rows="3" placeholder="Breve resumen de la edición..."></textarea>
          </div>
        </div>
      </div>

      <!-- YouTube -->
      <div class="card p-3">
        <h2 class="h5 mb-3">Video de YouTube</h2>
        <div class="row g-3">
          <div class="col-12">
            <label class="form-label">URL de YouTube</label>
            <input class="form-control" id="ytUrl" placeholder="https://www.youtube.com/watch?v=...">
          </div>
          <div class="col-12">
            <label class="form-label">Título</label>
            <input class="form-control" id="ytTitle" placeholder="Ej. Mesa de análisis fiscal 2025">
          </div>
          <div class="col-12">
            <label class="form-label">Descripción</label>
            <textarea class="form-control" id="ytDesc" rows="3" placeholder="Breve descripción del video..."></textarea>
          </div>
        </div>
      </div>

      <!-- Spotify -->
      <div class="card p-3">
        <h2 class="h5 mb-3">Podcast (Spotify)</h2>
        <div class="row g-3">
          <div class="col-12">
            <label class="form-label">URL de Spotify</label>
            <input class="form-control" id="spUrl" placeholder="https://open.spotify.com/episode/...">
          </div>
          <div class="col-12">
            <label class="form-label">Título</label>
            <input class="form-control" id="spTitle" placeholder="Ej. Estrategias patrimoniales">
          </div>
          <div class="col-12">
            <label class="form-label">Descripción</label>
            <textarea class="form-control" id="spDesc" rows="3" placeholder="Breve descripción del podcast..."></textarea>
          </div>
        </div>
      </div>

      <div class="d-flex gap-2">
        <button class="btn btn-primary" type="submit">Guardar</button>
        <a href="../index.html" class="btn btn-outline-light">Ir al sitio</a>
      </div>
    </form>
  </div>

  <!-- Toast (notificación flotante) -->
  <div class="position-fixed bottom-0 end-0 p-3" style="z-index:1100">
    <div id="toastMsg" class="toast align-items-center text-bg-success border-0" role="alert" aria-live="assertive" aria-atomic="true">
      <div class="d-flex">
        <div class="toast-body">Información guardada correctamente ✅</div>
        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Cerrar"></button>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- JS Section Slides -->
  <script>
    const DATA_URL = '../assets/data/home-highlights.json';

    function toggleMagManual(){
      magManual.style.opacity = magAuto.checked ? .4 : 1;
      [...magManual.querySelectorAll('input,textarea')].forEach(el=>{
        el.disabled = magAuto.checked;
      });
    }

    async function loadData(){
      try{
        const r = await fetch(DATA_URL, {cache:'no-store'});
        if(!r.ok) throw new Error('HTTP '+r.status);
        const d = await r.json();
        magAuto.checked = !!d.magazine?.auto;
        magCover.value = d.magazine?.cover ?? '';
        magDoc.value   = d.magazine?.doc   ?? '';
        magTitle.value = d.magazine?.title ?? '';
        magDesc.value  = d.magazine?.desc  ?? '';
        ytUrl.value    = d.youtube?.url    ?? '';
        ytTitle.value  = d.youtube?.title  ?? '';
        ytDesc.value   = d.youtube?.desc   ?? '';
        spUrl.value    = d.podcast?.url    ?? '';
        spTitle.value  = d.podcast?.title  ?? '';
        spDesc.value   = d.podcast?.desc   ?? '';
        toggleMagManual();
      }catch(e){
        showToast('No se pudo cargar el archivo de datos ❌ ' + (e.message||e), true);
      }
    }

    function showToast(message, isError=false){
      const toastEl = document.getElementById('toastMsg');
      const body = toastEl.querySelector('.toast-body');
      body.textContent = message;
      toastEl.classList.toggle('text-bg-success', !isError);
      toastEl.classList.toggle('text-bg-danger',  isError);
      const toast = bootstrap.Toast.getOrCreateInstance(toastEl, { delay: 2500 });
      toast.show();
    }

    form.addEventListener('submit', async (e)=>{
      e.preventDefault();
      const payload = {
        magazine: {
          auto:  magAuto.checked,
          cover: magCover.value.trim(),
          doc:   magDoc.value.trim(),
          title: magTitle.value.trim(),
          desc:  magDesc.value.trim()
        },
        youtube: {
          url:   ytUrl.value.trim(),
          title: ytTitle.value.trim(),
          desc:  ytDesc.value.trim()
        },
        podcast: {
          url:   spUrl.value.trim(),
          title: spTitle.value.trim(),
          desc:  spDesc.value.trim()
        }
      };

      try{
        const r = await fetch('save-home-highlights.php', {
          method:'POST',
          headers:{'Content-Type':'application/json'},
          body: JSON.stringify(payload)
        });
        const txt = await r.text();
        if (r.ok && txt.includes('OK')){
          showToast('Información guardada correctamente ✅', false);
        } else {
          showToast('Error al guardar ❌ ' + txt, true);
        }
      }catch(err){
        showToast('Error de red ❌ ' + (err.message||err), true);
      }
    });

    magAuto.addEventListener('change', toggleMagManual);
    loadData();
  </script>
</body>
</html>
